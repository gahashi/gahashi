<svg
        width="100%"
        height="330"
        viewBox="0 0 1000 330"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="title desc"
>

    <title id="title">Gahashi's Dev Casino</title>

    <desc id="desc">
        Máquina caça-níquel temática de desenvolvimento.
        Clique para abrir o Dev Casino.
    </desc>

    <defs>

        <linearGradient
                id="headerGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%"
        >
            <stop offset="0%" stop-color="#5A1F1A"/>
            <stop offset="45%" stop-color="#A63D2F"/>
            <stop offset="75%" stop-color="#D9772B"/>
            <stop offset="100%" stop-color="#E5B94A"/>
        </linearGradient>

        <filter id="softGlow">
            <feGaussianBlur
                    stdDeviation="4"
                    result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <pattern
                id="scanlines"
                width="4"
                height="4"
                patternUnits="userSpaceOnUse"
        >
            <rect
                    x="0"
                    y="0"
                    width="4"
                    height="2"
                    fill="#000000"
                    opacity="0.10"
            />
        </pattern>

    </defs>

    <style>

        .bg {
        fill: #1A0F0A;
        }

        .machine {
        fill: #24120D;
        stroke: #5A1F1A;
        stroke-width: 3;
        }

        .topbar {
        fill: url(#headerGradient);
        }

        .title {
        fill: #F4E7C5;

        font-family:
        "Courier New",
        monospace;

        font-size: 32px;

        font-weight: 700;

        text-anchor: middle;

        letter-spacing: 2px;
        }

        .subtitle {
        fill: #E5B94A;

        font-family:
        "Courier New",
        monospace;

        font-size: 14px;

        text-anchor: middle;
        }

        .slot {
        fill: #110805;

        stroke: #A63D2F;

        stroke-width: 2;
        }

        .symbol {
        fill: #F4E7C5;

        font-family:
        "Courier New",
        monospace;

        font-size: 30px;

        font-weight: bold;

        text-anchor: middle;

        dominant-baseline: middle;
        }

        .slot-label {
        fill: #D9772B;

        font-family:
        "Courier New",
        monospace;

        font-size: 12px;

        text-anchor: middle;
        }

        .click {
        fill: #F4E7C5;

        font-family:
        "Courier New",
        monospace;

        font-size: 17px;

        font-weight: bold;

        text-anchor: middle;

        animation:
        clickBlink
        1.1s
        infinite;
        }

        .hint {
        fill: #D9772B;

        font-family:
        "Courier New",
        monospace;

        font-size: 12px;

        text-anchor: middle;
        }

        .light {
        animation:
        lightPulse
        1.1s
        infinite
        alternate;
        }

        .light-1 {
        fill: #5A1F1A;
        }

        .light-2 {
        fill: #A63D2F;
        animation-delay: .15s;
        }

        .light-3 {
        fill: #D9772B;
        animation-delay: .30s;
        }

        .light-4 {
        fill: #E5B94A;
        animation-delay: .45s;
        }

        .light-5 {
        fill: #D9772B;
        animation-delay: .60s;
        }

        .light-6 {
        fill: #A63D2F;
        animation-delay: .75s;
        }

        .reel-a {
        animation:
        reelA
        3.6s
        infinite;
        }

        .reel-b {
        animation:
        reelB
        4.2s
        infinite;
        }

        .reel-c {
        animation:
        reelC
        3.9s
        infinite;
        }

        .status {
        fill: #E5B94A;

        font-family:
        "Courier New",
        monospace;

        font-size: 12px;

        text-anchor: middle;
        }

        @keyframes lightPulse {

        from {
        opacity: .35;
        }

        to {
        opacity: 1;
        filter: url(#softGlow);
        }

        }

        @keyframes clickBlink {

        0%,
        45% {
        opacity: 1;
        }

        50%,
        100% {
        opacity: .35;
        }

        }

        @keyframes reelA {

        0%,
        20% {
        transform: translateY(0);
        }

        25%,
        45% {
        transform: translateY(-72px);
        }

        50%,
        70% {
        transform: translateY(-144px);
        }

        75%,
        100% {
        transform: translateY(0);
        }

        }

        @keyframes reelB {

        0%,
        18% {
        transform: translateY(-72px);
        }

        24%,
        44% {
        transform: translateY(-144px);
        }

        50%,
        72% {
        transform: translateY(0);
        }

        78%,
        100% {
        transform: translateY(-72px);
        }

        }

        @keyframes reelC {

        0%,
        16% {
        transform: translateY(-144px);
        }

        24%,
        46% {
        transform: translateY(0);
        }

        52%,
        74% {
        transform: translateY(-72px);
        }

        80%,
        100% {
        transform: translateY(-144px);
        }

        }

        @media (prefers-reduced-motion: reduce) {

        .light,
        .click,
        .reel-a,
        .reel-b,
        .reel-c {
        animation: none;
        }

        }

    </style>

    <!-- fundo -->

    <rect
            class="bg"
            width="1000"
            height="330"
            rx="20"
    />

    <!-- máquina -->

    <rect
            class="machine"
            x="105"
            y="20"
            width="790"
            height="290"
            rx="20"
    />

    <!-- topo -->

    <rect
            class="topbar"
            x="105"
            y="20"
            width="790"
            height="70"
            rx="20"
    />

    <rect
            fill="#A63D2F"
            x="105"
            y="70"
            width="790"
            height="20"
    />

    <text
            class="title"
            x="500"
            y="56"
    >
        🎰 GAHASHI'S DEV CASINO
    </text>

    <text
            class="subtitle"
            x="500"
            y="78"
    >
        CODE • BUILD • DEPLOY • REPEAT
    </text>

    <!-- luzes -->

    <circle
            class="light light-1"
            cx="220"
            cy="110"
            r="6"
    />

    <circle
            class="light light-2"
            cx="330"
            cy="110"
            r="6"
    />

    <circle
            class="light light-3"
            cx="440"
            cy="110"
            r="6"
    />

    <circle
            class="light light-4"
            cx="560"
            cy="110"
            r="6"
    />

    <circle
            class="light light-5"
            cx="670"
            cy="110"
            r="6"
    />

    <circle
            class="light light-6"
            cx="780"
            cy="110"
            r="6"
    />

    <!-- slot 1 -->

    <rect
            class="slot"
            x="230"
            y="130"
            width="160"
            height="82"
            rx="8"
    />

    <svg
            x="230"
            y="130"
            width="160"
            height="82"
            viewBox="0 0 160 82"
            overflow="hidden"
    >

        <g class="reel-a">

            <text
                    class="symbol"
                    x="80"
                    y="41"
            >
                ⚛
            </text>

            <text
                    class="symbol"
                    x="80"
                    y="113"
            >
                TS
            </text>

            <text
                    class="symbol"
                    x="80"
                    y="185"
            >
                ▲
            </text>

        </g>

    </svg>

    <text
            class="slot-label"
            x="310"
            y="230"
    >
        BUILD
    </text>

    <!-- slot 2 -->

    <rect
            class="slot"
            x="420"
            y="130"
            width="160"
            height="82"
            rx="8"
    />

    <svg
            x="420"
            y="130"
            width="160"
            height="82"
            viewBox="0 0 160 82"
            overflow="hidden"
    >

        <g class="reel-b">

            <text
                    class="symbol"
                    x="80"
                    y="41"
            >
                NODE
            </text>

            <text
                    class="symbol"
                    x="80"
                    y="113"
            >
                REDIS
            </text>

            <text
                    class="symbol"
                    x="80"
                    y="185"
            >
                API
            </text>

        </g>

    </svg>

    <text
            class="slot-label"
            x="500"
            y="230"
    >
        AUTOMATE
    </text>

    <!-- slot 3 -->

    <rect
            class="slot"
            x="610"
            y="130"
            width="160"
            height="82"
            rx="8"
    />

    <svg
            x="610"
            y="130"
            width="160"
            height="82"
            viewBox="0 0 160 82"
            overflow="hidden"
    >

        <g class="reel-c">

            <text
                    class="symbol"
                    x="80"
                    y="41"
            >
                🐳
            </text>

            <text
                    class="symbol"
                    x="80"
                    y="113"
            >
                🐧
            </text>

            <text
                    class="symbol"
                    x="80"
                    y="185"
            >
                SSH
            </text>

        </g>

    </svg>

    <text
            class="slot-label"
            x="690"
            y="230"
    >
        OPERATE
    </text>

    <!-- chamada -->

    <text
            class="click"
            x="500"
            y="267"
    >
        ▶ CLICK TO SPIN ◀
    </text>

    <text
            class="hint"
            x="500"
            y="290"
    >
        Try your luck with my stack
    </text>

    <!-- scanlines -->

    <rect
            width="1000"
            height="330"
            rx="20"
            fill="url(#scanlines)"
            pointer-events="none"
    />

</svg>